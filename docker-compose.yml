services:
  redis:
    image: redis:7-alpine
    container_name: yaga-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: yaga-backend
    restart: unless-stopped
    shm_size: '1gb'
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL=1800
    depends_on:
      - redis
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    container_name: yaga-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  redis_data: